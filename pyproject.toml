[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-coupling"
version = "5.0.0"
description = "Motif-preserving null models and gap-free degeneracy theory for connectome-derived spiking networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ashok Raj Pasala" },
    { name = "Snigdha Gorai" },
    { name = "Jeevana Jyothi P." },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "networkx>=3.2.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1.2",
    "pyarrow>=15.0.0",
    "torch>=2.2.0",
    "h5py>=3.10.0",
    # The published null ensemble. The unit-model comparison calls
    # bct.reference.randmio_*_connected directly so that it randomises against
    # the same ensemble the result under test was measured against, rather than
    # a reimplementation of it.
    "bctpy>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyflakes>=3.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]
neuromorphic = [
    "lava-nc>=1.4.0",
    "snntorch>=0.9.1",
]
# Logic synthesis of the RTL. The WASM build of ABC in yowasp-yosys aborts on the
# Nangate45 liberty file, so the synthesis experiment expects native Yosys/ABC
# (e.g. the OSS CAD Suite) on PATH or under hardware/tools/.
synthesis = [
    "yowasp-yosys>=0.45",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
